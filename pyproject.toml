[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-subscription-escrow-replay"
version = "0.1.0"
description = "Replay prepaid subscription deposits, periodic charges and cancellation with service entitlement checkpoints."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-subscription-escrow-replay = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
